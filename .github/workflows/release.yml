name: Release

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned release tools
        run: |
          python -m pip install --disable-pip-version-check skills-ref==0.1.1 PyYAML==6.0.3
          npm install --global @anthropic-ai/claude-code@2.1.241 clawhub@0.23.3

      - name: Validate, release, and publish
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/publish.sh --release --tag "$RELEASE_TAG"
